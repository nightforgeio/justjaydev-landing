<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · JustJayDev</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <style>
    :root { --bg: #000; --fg: #f4f4f0; --muted: #6b6b66; --accent: #c6ff3d; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--fg); font-family: "JetBrains Mono", ui-monospace, monospace; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; padding: 24px; }
    .code { font-size: clamp(80px, 20vw, 160px); font-weight: 700; color: var(--accent); line-height: 1; }
    .msg { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.8; }
    .home { display: inline-block; padding: 12px 24px; border: 1px solid var(--muted); border-radius: 999px; color: var(--fg); text-decoration: none; font-size: 13px; transition: border-color .2s, color .2s; }
    .home:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="code">404</div>
  <p class="msg">$ page --find<br>exit code 404: not found</p>
  <a class="home" href="./">← back home</a>
</body>
</html>
