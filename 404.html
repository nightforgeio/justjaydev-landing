<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — JustJayDev</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <style>
    :root { --bg: #08090e; --text: #edf0f7; --accent: #c6ff3d; --mono: "JetBrains Mono", ui-monospace, monospace; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--mono); background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .box { max-width: 480px; width: 100%; }
    .code { font-size: clamp(64px, 15vw, 120px); font-weight: 900; color: var(--accent); line-height: 1; }
    .msg { margin: 16px 0 24px; color: #8b92a8; font-size: 14px; line-height: 1.6; }
    .msg::before { content: "$ page --find\n"; color: var(--accent); white-space: pre; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; }
    .links a { display: inline-flex; align-items: center; padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); color: var(--text); text-decoration: none; font-size: 13px; transition: border-color .15s; min-height: 44px; }
    .links a:hover { border-color: var(--accent); }
    .links a.primary { background: var(--accent); color: var(--bg); border-color: transparent; font-weight: 700; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <p class="msg">exit code 404: page not found.<br>Try one of these instead:</p>
    <div class="links">
      <a class="primary" href="/">Home</a>
      <a href="/#projects">Projects</a>
      <a href="/#links">Links</a>
    </div>
  </div>
</body>
</html>
